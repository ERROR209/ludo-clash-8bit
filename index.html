<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D LUDO PARTY × 8-BIT CHAOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <!-- CLEAN FUN LOBBY -->
  <div id="menu-screen" class="screen active">
    <div class="royal-card">
      <div class="crown-icon">👑</div>
      <h1 class="royal-title">LUDO PARTY 3D</h1>
      <div class="royal-badge">FUN & CHAOS EDITION</div>

      <div class="name-box">
        <label>YOUR NICKNAME</label>
        <input type="text" id="player-name" maxlength="10" placeholder="Enter Name" value="Player1" />
      </div>

      <div class="toggles-row">
        <label class="toggle-chip">
          <input type="checkbox" id="opt-fast-start" checked />
          <span>⚡ Fast Start</span>
        </label>
        <label class="toggle-chip">
          <input type="checkbox" id="opt-chaos" checked />
          <span>❓ Lucky Chaos</span>
        </label>
      </div>

      <div class="menu-stack">
        <button class="glossy-btn btn-green" onclick="startLocalGame('bot')">🤖 PLAY VS COMPUTER</button>
        <button class="glossy-btn btn-blue" onclick="startLocalGame('local')">👥 PASS & PLAY (2P)</button>
        <button class="glossy-btn btn-gold" onclick="showOnlineLobby()">🌐 PLAY WITH FRIENDS</button>
      </div>

      <div id="online-panel" class="hidden online-box">
        <button class="glossy-btn btn-purple" onclick="hostOnlineGame()">➕ CREATE ROOM</button>
        <div id="host-info" class="hidden room-card">
          <span>ROOM CODE</span>
          <strong id="room-code-display">----</strong>
          <small id="lobby-players-list">Waiting for friends...</small>
          <button id="start-online-btn" class="glossy-btn btn-green hidden" onclick="launchOnlineMatch()">▶ START PARTY</button>
        </div>

        <div class="join-bar">
          <input type="text" id="join-code-input" maxlength="5" placeholder="CODE" />
          <button class="glossy-btn btn-red" onclick="joinOnlineGame()">JOIN</button>
        </div>
        <p id="net-status" class="net-msg"></p>
      </div>
    </div>
  </div>

  <!-- 3D LUDO PARTY BOARD SCREEN -->
  <div id="game-screen" class="screen">
    <div class="hud-row">
      <div id="pcard-1" class="lk-profile green-p">
        <div class="lk-avatar" style="background:#16a34a;">G</div>
        <div class="lk-info">
          <div class="lk-name" id="pname-1">GREEN</div>
          <div class="lk-sub" id="pscore-1">🏠0/4</div>
        </div>
        <div id="emote-1" class="emote-bubble hidden">😂</div>
      </div>

      <div class="mid-controls">
        <button class="sound-pill" onclick="toggleSound()" id="sound-btn">🔊</button>
        <button class="sound-pill" onclick="toggleCameraView()" id="cam-btn">🎥 3D</button>
      </div>

      <div id="pcard-2" class="lk-profile yellow-p">
        <div id="emote-2" class="emote-bubble hidden">😂</div>
        <div class="lk-info" style="text-align:right;">
          <div class="lk-name" id="pname-2">YELLOW</div>
          <div class="lk-sub" id="pscore-2">🏠0/4</div>
        </div>
        <div class="lk-avatar" style="background:#eab308;">Y</div>
      </div>
    </div>

    <div class="wooden-frame" id="three-container">
      <div id="toast-banner" class="lk-toast hidden">SAFE STAR!</div>
    </div>

    <!-- FUN SOUND EMOTE BAR -->
    <div class="emote-bar">
      <button onclick="sendEmote('😂')">😂</button>
      <button onclick="sendEmote('😭')">😭</button>
      <button onclick="sendEmote('🔥')">🔥</button>
      <button onclick="sendEmote('😱')">😱</button>
      <button onclick="sendEmote('👑')">👑</button>
    </div>

    <div class="hud-row">
      <div id="pcard-0" class="lk-profile red-p">
        <div class="lk-avatar" style="background:#dc2626;">R</div>
        <div class="lk-info">
          <div class="lk-name" id="pname-0">RED</div>
          <div class="lk-sub" id="pscore-0">🏠0/4</div>
        </div>
        <div id="emote-0" class="emote-bubble hidden">😂</div>
      </div>

      <div class="center-dice-dock">
        <div id="turn-indicator" class="turn-pill">RED'S TURN</div>
        <div class="dice-scene" onclick="handleDiceClick()">
          <div id="cube-dice" class="cube show-1">
            <div class="face f1"><span class="dot"></span></div>
            <div class="face f2"><span class="dot"></span><span class="dot"></span></div>
            <div class="face f3"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <div class="face f4"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <div class="face f5"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <div class="face f6"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          </div>
        </div>
        <div id="action-hint" class="hint-pill">TAP DICE</div>
      </div>

      <div id="pcard-3" class="lk-profile blue-p">
        <div id="emote-3" class="emote-bubble hidden">😂</div>
        <div class="lk-info" style="text-align:right;">
          <div class="lk-name" id="pname-3">BLUE</div>
          <div class="lk-sub" id="pscore-3">🏠0/4</div>
        </div>
        <div class="lk-avatar" style="background:#2563eb;">B</div>
      </div>
    </div>
  </div>

  <!-- INSTANT 3-SECOND FUNNY 8-BIT CLASH CUTSCENE (ZERO BUTTONS!) -->
  <div id="clash-modal" class="retro-overlay hidden">
    <div class="retro-console">
      <div class="retro-top-bar" id="clash-title">★ 8-BIT CLASH! ★</div>
      <div class="pixel-stage-frame">
        <canvas id="clash-canvas" width="320" height="170"></canvas>
      </div>
      <div id="clash-caption" class="retro-dialogue">BONK!!</div>
    </div>
  </div>

  <!-- WINNER MODAL -->
  <div id="winner-modal" class="retro-overlay hidden">
    <div class="royal-card">
      <div class="crown-icon">🏆</div>
      <h2 id="winner-title" class="royal-title">RED WINS!</h2>
      <p style="color:#dbeafe;margin:10px 0 18px;">Ludo Party Champion!</p>
      <button class="glossy-btn btn-green" onclick="location.reload()">PLAY AGAIN</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
